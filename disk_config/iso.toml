# Installations-ISO für den Laptop: grafisches Anaconda, Platten und
# Partitionen wählst du selbst (Sergej, 10.10.2026). Bewusst KEINE
# Partitionierung im Kickstart — sonst entscheidet der Installer.
#
# Im Installer NUR die Samsung 850 EVO auswählen. Hintergrund:
# Vault → Pavlonya OS → „Vorfall: Installer löschte alle EFI-Partitionen".

# Vorgaben im Kickstart (im Installer weiterhin änderbar): Sprache Deutsch,
# Tastatur de nodeadkeys, Zeitzone Berlin.
#
# Root-Konto und Benutzer bleiben beide frei wählbar (Sergej, 10.10.2026).
# Anaconda verlangt nur eines von beiden; fehlt der Benutzer, legt
# pavlonya-ensure-user.service ihn beim ersten Start an.
[customizations.installer.kickstart]
contents = """
graphical
lang de_DE.UTF-8
keyboard --vckeymap=de-nodeadkeys --xlayouts='de (nodeadkeys)'
timezone Europe/Berlin
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Localization",
  "org.fedoraproject.Anaconda.Modules.Timezone",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Storage",
]
