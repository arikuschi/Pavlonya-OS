# Distroboxen für Pavlonya OS. Einmalig anlegen mit:
#   distrobox assemble create --file /usr/share/pavlonya-os/distrobox.ini

# Claude Desktop gibt es von Anthropic nur als .deb (apt-Quelle). Die Box
# hält es per apt aktuell und legt es ins Startmenü.
[claude]
image=docker.io/library/ubuntu:24.04
init_hooks="command -v claude-desktop >/dev/null || { apt-get update && apt-get install -y curl gnupg && curl -fsSL https://downloads.claude.ai/claude-desktop/key.asc -o /usr/share/keyrings/claude-desktop-archive-keyring.asc && echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/claude-desktop-archive-keyring.asc] https://downloads.claude.ai/claude-desktop/apt/stable stable main' > /etc/apt/sources.list.d/claude-desktop.list && apt-get update && apt-get install -y claude-desktop; }"
# ChatGPT (OpenAI): ebenfalls nur als .deb (apt-Quelle) — Wunsch 12.10.2026.
# Schlüssel und Quelle liegen im Image, die Box sieht sie unter /run/host.
init_hooks="command -v chatgpt >/dev/null || { install -Dm644 /run/host/usr/share/pavlonya-os/keys/chatgpt-archive-keyring.gpg /usr/share/keyrings/chatgpt-archive-keyring.gpg && install -Dm644 /run/host/usr/share/pavlonya-os/keys/chatgpt.sources /etc/apt/sources.list.d/chatgpt.sources && apt-get update && apt-get install -y ca-certificates && apt-get update && apt-get install -y chatgpt; }"
exported_apps="claude-desktop chatgpt"
# Kein eigener Menüeintrag für die Box selbst (sonst zweimal „Claude“ im Menü:
# einmal die Box mit Ubuntu-Symbol, einmal die App — VM-Test 11.10.2026)
entry=false
nvidia=true

# Entwicklung: Compiler und Python (unter Pop!_OS: gcc-14, python3-pip, python3-wxgtk4.0)
[dev]
image=registry.fedoraproject.org/fedora-toolbox:44
additional_packages="gcc gcc-c++ make python3-pip python3-wxpython4"
# Gleich beim Anlegen starten, damit die Pakete sofort installiert werden
# (sonst erst beim ersten „distrobox enter dev“ — VM-Test 11.10.2026)
start_now=true
