name: Pavlonya OS bauen

on:
  schedule:
    - cron: "30 4 * * *"      # täglich: Fedora- und NVIDIA-Updates einsammeln
  push:
    branches: [main]
    paths-ignore: ["**.md", "scripts/**", "disk_config/**"]   # betreffen nur ISO/VM, nicht das Image
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: pavlonya-os
  FEDORA_VERSION: "44"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    # Fremde Actions auf Commit-Kennungen festgelegt, nicht auf verschiebbare Tags:
    # derselbe Job bekommt den privaten Signaturschlüssel (SIGNING_SECRET).
    # Aktualisieren: neue Kennung zur gewünschten Version eintragen und prüfen.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - name: Platz auf dem Runner schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Image-Namen festlegen
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REF=ghcr.io/${OWNER}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Bauen
        run: |
          set -euxo pipefail
          test -s keys/cosign.pub || { echo "keys/cosign.pub fehlt"; exit 1; }
          sudo podman build --pull=newer \
            --build-arg FEDORA_VERSION="${FEDORA_VERSION}" \
            --build-arg IMAGE_REF="${IMAGE_REF}" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            -t "${IMAGE_NAME}:build" .

      - name: Rauchtest
        run: |
          sudo podman run --rm "${IMAGE_NAME}:build" bash -euxc '
            # "! befehl" bricht unter set -e nie ab — Verneinungen deshalb über nicht()
            nicht() { if "$@"; then echo "FEHLER: darf nicht zutreffen: $*" >&2; exit 1; fi; }
            cat /usr/lib/pavlonya-os-release
            rpm -q cosmic-session kmod-nvidia nvidia-driver steam code openssh-server gnome-keyring-pam
            test -f /usr/share/wayland-sessions/cosmic.desktop
            rpm -q plymouth plymouth-plugin-two-step && test "$(plymouth-set-default-theme)" = pavlonya && test -s /usr/share/plymouth/themes/pavlonya/watermark.png && grep -q rhgb /usr/lib/bootc/kargs.d/10-pavlonya-startbild.toml
            nicht rpm -q fedora-logos
            for v in /usr/lib/efi/shim/*/EFI/fedora; do test -s "$v/shimx64.efi"; nicht test -e "$v/shim.efi"; iconv -f UTF-16LE -t UTF-8 "$v/BOOTX64.CSV" | grep -q ",Pavlonya OS,"; done
            grep -q "numlock_state: BootOn" /usr/share/cosmic/com.system76.CosmicComp/v1/keyboard_config
            test -x /usr/lib/opt/Tabby/tabby || test -x /opt/Tabby/tabby
            grep -q "${0}" /etc/containers/policy.json && grep -q sigstoreSigned /etc/containers/policy.json
            test ! -e /usr/lib/systemd/system/pavlonya-signiert-umstellen.service
            rpm -q upower
            grep -q "^ExecStartPre=/usr/bin/sleep 2" /usr/lib/systemd/system/cosmic-greeter.service.d/10-pavlonya-warten.conf
            grep -q PAVLONYA_FLATPAK_OHNE_KENNWORT /usr/share/polkit-1/rules.d/50-pavlonya-flatpak.rules
            nicht grep -q "\"org.freedesktop.Flatpak.configure-remote\"" /usr/share/polkit-1/rules.d/50-pavlonya-flatpak.rules
            rpm -q nss-mdns && grep -Eq "^hosts:.*mdns4_minimal" /etc/nsswitch.conf
            ssh-keygen -A >/dev/null && sshd -T | grep -qi "^permitrootlogin no"
            test -x /usr/libexec/pavlonya-ersteinrichtung && rpm -q zenity gnome-disk-utility gparted
            grep -q "@NVIDIA_GPU_UUID@" /usr/share/pavlonya-os/minimon/gpus && test -x /usr/sbin/nvidia-smi
            nicht grep -Eq "GPU-[0-9a-f]{8}-" /usr/share/pavlonya-os/minimon/gpus
            test -x /usr/bin/pavlonya-wiederherstellen && test -x /usr/libexec/pavlonya-backup
            grep -q "\.config/tabby" /usr/bin/pavlonya-wiederherstellen
            test "$(grep -c distrobox-fontconfig.conf /usr/share/pavlonya-os/distrobox.ini)" -eq 2
            nicht grep -q "Fontconfig error" <<< "$(FONTCONFIG_FILE=/usr/share/pavlonya-os/distrobox-fontconfig.conf fc-list 2>&1)"
            for p in gdm gnome-shell mutter rygel breeze-icon-theme localsearch python3-botocore toolbox ModemManager atheros-firmware; do nicht rpm -q "$p" > /dev/null; done   # nichts Ungenutztes (keine Empfehlungen)
            for p in nvidia-gpu-firmware microcode_ctl qemu-user-static qemu-user-static-aarch64 default-fonts-cjk google-noto-sans-cjk-vf-fonts xorg-x11-nvidia nvidia-xconfig NetworkManager-cloud-setup; do nicht rpm -q "$p" > /dev/null; done   # Prüfung gegen die Hardware 30.10.2026
            rpm -q default-fonts-core default-fonts-other amd-ucode-firmware mt7xxx-firmware linux-firmware && nicht compgen -G "/usr/lib/firmware/nvidia/*/*tu10x*"
            grep -q "^ghcr.io/" /usr/share/pavlonya-os/image-ref
            grep -q "^PRETTY_NAME=\"Pavlonya OS " /etc/os-release && grep -q "^ID=fedora$" /etc/os-release
            test -f /usr/share/icons/hicolor/scalable/apps/pavlonya-os.svg
            rpm -q gnome-keyring | grep -q "\.pavlonya\." && grep -q "Couldn.t open a session for this caller" /usr/bin/gnome-keyring-daemon
          ' "${IMAGE_REF}"

      # Neu in Schichten aufteilen (Fedoras Werkzeug): entfernte Pakete des
      # Grundbestands liegen sonst ausgeblendet in der untersten Schicht weiter und
      # werden mit heruntergeladen. Nebeneffekt: Updates laden nur geänderte Pakete.
      - name: Neu aufteilen (rechunk)
        run: |
          set -euxo pipefail
          sudo podman run --rm --privileged -v /var/lib/containers:/var/lib/containers \
            "quay.io/fedora/fedora-bootc:${FEDORA_VERSION}" \
            /usr/libexec/bootc-base-imagectl rechunk \
            "localhost/${IMAGE_NAME}:build" "localhost/${IMAGE_NAME}:chunked"
          sudo podman inspect "localhost/${IMAGE_NAME}:chunked" --format '{{json .Labels}}'
          test "$(sudo podman inspect "localhost/${IMAGE_NAME}:chunked" --format '{{index .Labels "containers.bootc"}}')" = 1
          sudo podman run --rm "localhost/${IMAGE_NAME}:chunked" bash -c \
            '! rpm -q python3-botocore gdm && test ! -e /usr/lib/python3*/site-packages/botocore && cat /usr/lib/pavlonya-os-release'
          sudo podman images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep "${IMAGE_NAME}"

      - name: Hochladen
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${REGISTRY_PASSWORD}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for TAG in "${FEDORA_VERSION}" "${FEDORA_VERSION}-$(date -u +%Y%m%d)" latest; do
            sudo podman push --digestfile /tmp/digest "localhost/${IMAGE_NAME}:chunked" "docker://${IMAGE_REF}:${TAG}"
          done
          echo "DIGEST=$(cat /tmp/digest)" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac   # v3.9.1
        if: github.event_name != 'pull_request'

      # Signatur mit eigenem Schlüsselpaar: bootc prüft gegen keys/cosign.pub,
      # der im Image unter /etc/pki/containers/pavlonya-os.pub liegt.
      - name: Signieren
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${REGISTRY_PASSWORD}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE_REF}@${DIGEST}"
