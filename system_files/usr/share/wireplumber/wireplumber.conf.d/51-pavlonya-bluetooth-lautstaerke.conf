# Bluetooth-Lautsprecher: Lautstärke am Rechner regeln statt über AVRCP am Gerät
# (03.11.2026). Eine Bluetooth-Box am Laptop übernimmt die Lautstärke über AVRCP
# nicht: Regler 1–100 % gleich laut, 0 aus, erst über 100 % lauter (PipeWire
# verstärkt dann selbst). Die Liste bluez5.hw-volume ohne a2dp_sink wirkte nicht,
# deshalb der Hauptschalter. Folge: Tasten an Bluetooth-Kopfhörern bewegen den
# Regler in der Leiste nicht mehr mit.
monitor.bluez.properties = {
  bluez5.enable-hw-volume = false
}
