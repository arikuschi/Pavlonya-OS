# Fremde Grafiktreiber aus der initramfs lassen (30.10.2026).
#
# Für das Startbild nimmt dracut das Modul „plymouth“ und damit „drm“ auf; ohne
# hostonly packt „drm“ alle Grafiktreiber samt Firmware ein. Die initramfs wuchs
# so von 233 MB auf 342 MB, GRUB lädt sie über die Firmware ~4 s länger — so
# lange bleibt der Bildschirm nach Enter im GRUB-Menü schwarz.
# Gebraucht werden nur amdgpu und nvidia (99-nvidia.conf) und simpledrm.
omit_drivers+=" i915 xe nouveau radeon gma500_gfx "
