# Komprimierter Swap im Arbeitsspeicher wie unter Pop!_OS (04.11.2026).
# zram-generator ist im Basis-Image, seine Vorgabe kommt aber aus dem Paket
# zram-generator-defaults — einer Empfehlung, die ohne weak deps fehlt. Ohne
# diese Datei lief das System ganz ohne Swap (systemd-oomd: „No swap“,
# Speicheranforderungen schlugen fehl).
# Größe wie bei Pop!_OS: so groß wie der Arbeitsspeicher, belegt wird nur, was
# tatsächlich ausgelagert ist.
[zram0]
zram-size = ram
compression-algorithm = zstd
