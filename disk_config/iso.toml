# Installations-ISO für den Laptop: grafisches Anaconda, Platten und
# Partitionen wählst du selbst (10.10.2026). Bewusst KEINE
# Partitionierung im Kickstart — sonst entscheidet der Installer.
#
# Im Installer NUR die Samsung 850 EVO auswählen. Hintergrund:
# Vault → Pavlonya OS → „Vorfall: Installer löschte alle EFI-Partitionen".

# Vorgaben im Kickstart (im Installer weiterhin änderbar): Sprache Deutsch,
# Tastatur de (mit Tottasten wie unter Pop!_OS — „nodeadkeys“ war falsch,
# 02.11.2026), Zeitzone Berlin, Hardware-Uhr in UTC (ohne --utc stellt der
# Kickstart sie auf Ortszeit; Entscheidung UTC 25.10.2026).
#
# Root-Konto und Benutzer bleiben beide frei wählbar (10.10.2026).
# Anaconda verlangt nur eines von beiden; fehlt der Benutzer, legt
# pavlonya-ensure-user.service ihn beim ersten Start an.
[customizations.installer.kickstart]
contents = """
graphical
lang de_DE.UTF-8
keyboard --vckeymap=de --xlayouts='de'
timezone Europe/Berlin --utc
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Localization",
  "org.fedoraproject.Anaconda.Modules.Timezone",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Storage",
]
