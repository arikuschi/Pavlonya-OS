<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430">
  <!-- Pavlonya OS — Startbild: Logo „Ring-P“ (wie pavlonya-os.svg) mit Schriftzug.
       Durchsichtiger Hintergrund, den schwarzen setzt das Plymouth-Skript. -->
  <defs>
    <linearGradient id="verlauf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3cc6d6"/>
      <stop offset="1" stop-color="#4a5bd4"/>
    </linearGradient>
  </defs>
  <g transform="translate(272,0)">
    <circle cx="128" cy="128" r="128" fill="url(#verlauf)"/>
    <path d="M84 196V104" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    <circle cx="128" cy="104" r="44" fill="none" stroke="#ffffff" stroke-width="26"/>
  </g>
  <text x="400" y="400" text-anchor="middle" font-family="Open Sans" font-weight="600"
        font-size="84" letter-spacing="2" fill="#e8e8e8">Pavlonya OS</text>
