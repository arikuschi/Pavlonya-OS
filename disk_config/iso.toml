# Installations-ISO für den Laptop: grafisches Anaconda, Platten und
# Partitionen wählst du selbst (10.10.2026). Bewusst KEINE
# Partitionierung im Kickstart — sonst entscheidet der Installer.
#
# Im Installer NUR die Zielplatte auswählen. Hintergrund:
# Vault → Pavlonya OS → „Vorfall: Installer löschte alle EFI-Partitionen".
# Der Eintrag im Firmware-Startmenü heißt „Pavlonya OS“ (bootupd liest
# /etc/system-release des Images); das gilt erst für ISOs ab dem Bau vom 02.11.2026.

# Vorgaben im Kickstart (im Installer weiterhin änderbar): Sprache Deutsch,
# Tastatur de (mit Tottasten wie unter Pop!_OS — „nodeadkeys“ war falsch,
# 02.11.2026), Zeitzone Berlin, Hardware-Uhr in UTC (ohne --utc stellt der
# Kickstart sie auf Ortszeit; Entscheidung UTC 25.10.2026).
# %post: Zeitquelle nur per DHCP, siehe Kommentar dort.
#
# Root-Konto und Benutzer bleiben beide frei wählbar (10.10.2026).
# Anaconda verlangt nur eines von beiden; fehlt der Benutzer, legt
# pavlonya-ensure-user.service ihn beim ersten Start an.
[customizations.installer.kickstart]
contents = """
graphical
lang de_DE.UTF-8
keyboard --vckeymap=de --xlayouts='de'
timezone Europe/Berlin --utc
%post
# Anaconda ersetzt die Pool-Zeile durch „server _gateway iburst“. DHCP liefert
# denselben Router (MikroTik) noch einmal → chronyd meldet bei jedem Start
# „Already in use“. Zeitquelle bleibt nur die per DHCP (Arikushi, 07.11.2026).
for f in /etc/chrony.conf /ostree/deploy/*/deploy/*/etc/chrony.conf; do
    [ -f "$f" ] && sed -i '/^# These servers were defined in the installation:$/d; /^server _gateway iburst$/d' "$f"
done
true
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Localization",
  "org.fedoraproject.Anaconda.Modules.Timezone",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Storage",
]
