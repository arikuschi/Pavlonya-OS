# amdgpu vor nvidia laden (25.10.2026) — wie unter Pop!_OS, dort gegen einen
# schwarzen Start mit HDMI-Monitor. Nötig, seit die Grafiktreiber in der
# initramfs nicht mehr erzwungen, sondern von udev nebenher geladen werden
# (siehe build_files/20-kernel-nvidia.sh): so bleibt die AMD-Grafik
# (Laptop-Display) zuerst, die NVIDIA (HDMI) danach.
softdep nvidia pre: amdgpu
