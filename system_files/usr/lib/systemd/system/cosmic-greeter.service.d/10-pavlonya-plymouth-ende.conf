# Anmeldebildschirm erst starten, wenn Plymouth die Grafik freigegeben hat (30.10.2026).
# „plymouth quit“ kehrt zurück, bevor plymouthd endet; der Prozess hält die AMD-Grafik
# (Laptop-Display) noch ~0,7 s als DRM-Master. Greift der Anmeldebildschirm früher zu,
# bekommt er EBUSY und lässt das Laptop-Display weg (belegt mit systemd.log_level=debug,
# 26.10.2026). GDM beendet Plymouth selbst, der COSMIC-Greeter nicht. Ersetzt die
# feste 2-s-Pause; am Laptop getestet: 6 von 6 Starts in Ordnung. Höchstens 5 s.
[Service]
ExecStartPre=-/usr/bin/timeout 5 /usr/bin/bash -c 'while pgrep -x plymouthd >/dev/null; do sleep 0.1; done'
