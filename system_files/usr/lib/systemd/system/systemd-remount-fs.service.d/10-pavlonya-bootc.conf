# Anaconda trägt / in /etc/fstab ein (btrfs, ro). Bei bootc ist / aber ein
# composefs-Overlay; dessen Optionen lassen sich nicht ändern:
#   mount: /: fsconfig() failed: overlay: No changes allowed in reconfigure.
# Der Dienst meldete deshalb bei jedem Start einen Fehler (VM-Test 10.10.2026).
# Die übrigen Einträge werden weiterhin neu eingehängt; nur der Exit-Code wird
# ignoriert, damit „Failed Units" nicht dauerhaft rot steht.
[Service]
ExecStart=
ExecStart=-/usr/lib/systemd/systemd-remount-fs
