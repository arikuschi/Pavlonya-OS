# Anmeldebildschirm 2 s nach dem Ende des Startbilds starten (25.10.2026).
# Ohne die Pause scheiterte der Greeter in etwa jedem fünften Start an der
# AMD-Grafik (Laptop-Display), weil er sie knapp 0,7 s nach dem Ende von
# Plymouth übernehmen wollte: „Failed to add device /dev/dri/card1“, das
# Laptop-Display blieb dunkel, nur der 4K-Monitor an der NVIDIA lief.
# Seit dem Startbild (24.10.2026), vorher nie. Am Laptop getestet: mit der
# Pause 6 von 6 Starts in Ordnung, ohne sie 1 von 5 dunkel.
[Service]
ExecStartPre=/usr/bin/sleep 2
