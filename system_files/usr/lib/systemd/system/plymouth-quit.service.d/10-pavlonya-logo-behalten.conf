# Logo stehen lassen, bis der Anmeldebildschirm zeichnet (30.10.2026), wie Fedora
# mit GDM. Ohne --retain-splash gibt Plymouth beim Beenden die Textkonsole frei,
# und während der Anmeldebildschirm auf das Ende von plymouthd wartet, steht dort
# kurz Text.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
