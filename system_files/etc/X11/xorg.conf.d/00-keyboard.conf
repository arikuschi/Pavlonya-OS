# Tastatur für Anmeldebildschirm und Sitzung — muss zur Textkonsole
# (/etc/vconsole.conf) passen, sonst scheitern Kennwörter mit Buchstaben
# am Anmeldebildschirm (VM-Test 10.10.2026).
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "de"
        Option "XkbVariant" "nodeadkeys"
EndSection
