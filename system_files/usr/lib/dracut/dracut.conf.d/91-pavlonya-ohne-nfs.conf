# Keine NFS-Unterstützung in der initramfs (04.11.2026).
#
# nfs-utils ist für die TrueNAS im Image; ohne hostonly nimmt dracut deshalb das
# Modul „nfs“ auf, das für eine Systemplatte im Netz gedacht ist. In der
# initramfs starteten so rpcbind, rpc.statd und rpc.idmapd, meldeten bei jedem
# Start Fehler (fehlende Ordner, keine NFSv4-Domain) und wurden beim Wechsel ins
# System wieder beendet. Die Systemplatte liegt im Laptop; NFS im laufenden
# System bleibt unberührt.
omit_dracutmodules+=" nfs "
