# LVM- und Clevis-Module nicht in die initramfs (05.11.2026).
#
# fedora-bootc verlangt sie ausdrücklich (30-bootc-standard.conf: lvm,
# 50-bootc-clevis.conf: clevis, clevis-pin-tpm2; beide Dateien gehören keinem
# Paket). lvm2 und clevis sind aus dem Image entfernt — keine Platte nutzt LVM oder
# eine TPM-Entsperrung. Ohne diese Zeile bricht dracut mit „Module 'lvm' cannot be
# installed“ ab; ein weggelassenes Modul überspringt die Prüfung (dracut-init.sh).
omit_dracutmodules+=" lvm clevis clevis-pin-tpm2 "

# nsswitch.conf ausdrücklich aufnehmen (05.11.2026). Bisher brachte sie nur das
# CIFS-Modul aus dracut-network mit, das jetzt fehlt. Ohne sie liest die initramfs
# nur /etc/group und nicht /usr/lib/group (altfiles, 59-altfiles.conf von
# fedora-bootc): udev und tmpfiles meldeten im Bau 186e356 bei jedem Start rund 50
# Mal „Unknown group“ (audio, disk, video, tss …). Im System waren die Rechte richtig.
install_items+=" /etc/nsswitch.conf /etc/authselect/nsswitch.conf "
