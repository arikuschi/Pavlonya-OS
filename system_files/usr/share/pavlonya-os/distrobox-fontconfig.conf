<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Pavlonya OS: eigener fontconfig-Zwischenspeicher für Distroboxen.
  Die Boxen teilen $HOME mit dem Host. Ohne diese Datei schreiben Programme in
  der Box (Claude Desktop, ChatGPT) ihre Cache-Dateien nach ~/.cache/fontconfig,
  unter denselben Namen wie der Host. Electron-Programme auf dem Host (VS Code,
  Tabby) lesen sie dort und finden keine Schrift: VS Code ohne Text, Tabby
  stürzt ab. Unter Fedora Atomic hat /usr kein Änderungsdatum, deshalb fällt der
  fremde Cache nicht auf. Diese Datei steht in conf.d und damit vor den
  cachedir-Zeilen von fonts.conf, also schreibt die Box hierhin.
  Eingespielt von init_hooks in distrobox.ini.
-->
<fontconfig>
  <cachedir prefix="xdg">fontconfig-distrobox</cachedir>
</fontconfig>
