<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Regler „Tastaturbeleuchtung“ im COSMIC-Akku-Applet ausblenden (04.11.2026).
  Der Kernel hat für die Tastatur des Acer Nitro AN517-41 kein LED-Gerät;
  die Beleuchtung regelt die Firmware über die Fn-Tasten. UPower bietet
  KbdBacklight trotzdem an und meldet GetMaxBrightness = 0, das Applet
  zeigt dann einen nutzlosen Regler mit „NaN %“. Ohne Antwort auf die
  Abfrage lässt es den Regler weg.
  Liegt unter /etc, weil D-Bus diesen Ordner nach /usr/share/dbus-1/system.d
  liest — nur so gilt das deny gegen das allow aus org.freedesktop.UPower.conf.
-->
<busconfig>
  <policy context="default">
    <deny send_destination="org.freedesktop.UPower"
          send_interface="org.freedesktop.UPower.KbdBacklight"/>
  </policy>
</busconfig>
